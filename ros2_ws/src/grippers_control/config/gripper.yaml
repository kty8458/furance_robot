gripper_node:
  ros__parameters:
    interface_name: "enx00e01b76020c"
    expected_device_name: "EPG-L80-400"
    cycle_us: 5000
    ready_timeout_cycles: 4000
    move_timeout_cycles: 6000
    position_tolerance_units: 3
    monitor_period_ms: 100
    grippers: ["right", "left"]

    right:
