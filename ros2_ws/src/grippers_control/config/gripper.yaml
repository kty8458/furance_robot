      open_width_units: 1800
      object_width_units: 0
      object_width_error_units: 0
      max_finger_width_units: 1800
      min_finger_width_units: 1000

    left:
      slave_index: 3
      enable: 1
      close_speed: 80
      open_speed: 80
      close_force: 200
      close_width_units: 1000
      open_width_units: 1800
